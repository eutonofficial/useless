name: Automated Anti-Improvement PR Screener

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  auto-screen-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Screen for Clean Code or Performance Gains
        run: npm run screen:pr
