name: Rigorous Test & Anti-Nerf Integrity

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-ironclad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Verify Existing Tests Were Not Tampered With
        run: npm run test:integrity

      - name: Execute Full Test Suite (Must 100% Pass)
        run: npm test
